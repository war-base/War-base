<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>War Base</title>
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; background: #1a1a2e; touch-action: none; overscroll-behavior: none; font-family: Arial, sans-serif; }
    #game { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; background-color: #2d4a3e; }

    #top-bar {
      position: absolute; top: 0; left: 0; width: 100%; box-sizing: border-box;
      background: rgba(0, 0, 0, 0.75); color: white; padding: 12px; 
      display: flex; justify-content: space-around; font-weight: bold; font-size: 16px; z-index: 10; pointer-events: none;
    }
    .res-gold { color: #ffd700; }
    .res-elixir { color: #ff69b4; }

    #build-menu {
      position: absolute; bottom: 0; left: 0; width: 100%; box-sizing: border-box;
      background: rgba(0, 0, 0, 0.85); padding: 10px; display: flex; justify-content: space-around; gap: 10px;
      border-top: 2px solid #555; z-index: 10;
    }
    .build-btn {
      flex: 1; padding: 10px 5px; border: none; border-radius: 8px;
      background: #444; color: white; font-weight: bold; font-size: 12px;
      display: flex; flex-direction: column; align-items: center; gap: 5px; pointer-events: auto;
    }
    .build-btn.selected { background: #2d8a4e; border: 2px solid #55ff88; }
    .build-btn:active { background: #666; }
    .btn-sub { font-size: 10px; font-weight: normal; color: #ccc; }
    .btn-sub.gold { color: #ffd700; }
    .btn-sub.elixir { color: #ff69b4; }

    #attack-btn {
      position: absolute; bottom: 100px; right: 20px;
      background: #cc0000; color: white; border: 2px solid #ff4444;
      padding: 15px 25px; border-radius: 50px;
      font-size: 18px; font-weight: bold; z-index: 15;
      box-shadow: 0 4px 10px rgba(0,0,0,0.6); cursor: pointer;
    }
    #attack-btn:active { background: #990000; transform: scale(0.95); }

    #battle-ui {
      position: absolute; top: 0; left: 0; width: 100%; box-sizing: border-box;
      z-index: 10; pointer-events: none; display: none;
    }
    #battle-top-bar {
      background: rgba(0, 0, 0, 0.85); color: white; padding: 15px;
      display: flex; justify-content: space-between; align-items: center;
      font-size: 18px; font-weight: bold; pointer-events: auto;
    }
    #battle-top-bar button {
      background: #cc0000; color: white; border: none; padding: 10px 15px;
      border-radius: 8px; font-weight: bold;
    }

    #message {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: rgba(200, 0, 0, 0.9); color: white; padding: 10px 20px;
      border-radius: 8px; font-weight: bold; display: none; pointer-events: none; z-index: 20;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="game"></div>

  <div id="top-bar">
    <div class="res-gold">🪙 Złoto: <span id="ui-gold">1000</span></div>
    <div class="res-elixir">💧 Eliksir: <span id="ui-elixir">1000</span></div>
  </div>
  
  <div id="build-menu">
    <button class="build-btn" onclick="selectBuilding('townhall')">🏰 Ratusz<span class="btn-sub gold">1000 🪙</span></button>
    <button class="build-btn" onclick="selectBuilding('mine')">⛏️ Kopalnia<span class="btn-sub elixir">150 💧</span></button>
    <button class="build-btn" onclick="selectBuilding('barracks')">⚔️ Koszary<span class="btn-sub elixir">300 💧</span></button>
  </div>

  <button id="attack-btn" onclick="startAttack()">⚔️ Atakuj</button>

  <div id="battle-ui">
    <div id="battle-top-bar">
      <div>🪖 Armia: <span id="ui-army">20</span></div>
      <button onclick="endBattle(false)">Poddaj się</button>
    </div>
  </div>
  
  <div id="message">Za mało surowców!</div>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
  
  <script>
    // --- USTAWIENIA ---
    const TILE = 64; 
    const GRID = 25; 
    let gold = 1000;
    let elixir = 1000;
    let selectedBuildingType = null;
    let buildings = [];
    let prodTimer = 0;

    const BUILDINGS = {
      townhall: { name: 'Ratusz', cost: { gold: 1000, elixir: 0 }, color: 0x8b4513, stroke: 0x5a2d0c, prod: { gold: 0, elixir: 0 } },
      mine: { name: 'Kopalnia', cost: { gold: 0, elixir: 150 }, color: 0xffd700, stroke: 0xb8860b, prod: { gold: 10, elixir: 0 } },
      barracks: { name: 'Koszary', cost: { gold: 0, elixir: 300 }, color: 0x8b0000, stroke: 0x4a0000, prod: { gold: 0, elixir: 5 } }
    };
    const TROOP_STATS = { damage: 15, speed: 150, range: 40 };

    // --- INTERFEJS ---
    function updateUI() {
      document.getElementById('ui-gold').innerText = Math.floor(gold);
      document.getElementById('ui-elixir').innerText = Math.floor(elixir);
      const btns = document.querySelectorAll('.build-btn');
      if (btns.length >= 3) {
        btns.forEach(btn => btn.classList.remove('selected'));
        if (selectedBuildingType === 'townhall') btns[0].classList.add('selected');
        if (selectedBuildingType === 'mine') btns[1].classList.add('selected');
        if (selectedBuildingType === 'barracks') btns[2].classList.add('selected');
      }
    }

    function selectBuilding(type) {
      selectedBuildingType = (selectedBuildingType === type) ? null : type;
      if (window.preview) window.preview.setVisible(false);
      updateUI();
    }

    function showMessage(text) {
      const msg = document.getElementById('message');
      msg.innerText = text;
      msg.style.display = 'block';
      setTimeout(() => { msg.style.display = 'none'; }, 2000);
    }

    // --- ZAPIS ---
    function saveGame() {
      const data = { version: 2, gold: gold, elixir: elixir, buildings: buildings.map(b => ({ x: b.x, y: b.y, type: b.type })) };
      localStorage.setItem('warBaseSave', JSON.stringify(data));
    }
    function loadGame() {
      const saved = localStorage.getItem('warBaseSave');
      if (saved) {
        try {
          const data = JSON.parse(saved);
          if (data.version === 2 && typeof data.gold === 'number') {
            gold = data.gold; elixir = data.elixir; return data.buildings;
          } else { localStorage.removeItem('warBaseSave'); }
        } catch (e) { localStorage.removeItem('warBaseSave'); }
      }
      return [];
    }

    // --- EKRANY ---
    function startAttack() {
      document.getElementById('build-menu').style.display = 'none';
      document.getElementById('attack-btn').style.display = 'none';
      document.getElementById('top-bar').style.display = 'none';
      document.getElementById('battle-ui').style.display = 'block';
      document.getElementById('ui-army').innerText = "20"; 
      game.scene.start('BattleScene');
    }

    function endBattle(won = false) {
      document.getElementById('build-menu').style.display = 'flex';
      document.getElementById('attack-btn').style.display = 'block';
      document.getElementById('top-bar').style.display = 'flex';
      document.getElementById('battle-ui').style.display = 'none';
      if (won) {
        gold += 500; elixir += 200; updateUI(); saveGame();
        showMessage("Zwycięstwo!\nZdobyto 500 🪙 i 200 💧");
      }
      game.scene.start('BaseScene');
    }

    // --- SCENA BAZY ---
    class BaseScene extends Phaser.Scene {
      constructor() { super('BaseScene'); }
      create() {
        let cam = this.cameras.main;
        let grid = this.add.grid(0, 0, TILE * GRID, TILE * GRID, TILE, TILE, 0x2d4a3e, 1, 0x5a8a6e, 1);
        grid.setOrigin(0, 0);

        window.preview = this.add.rectangle(0, 0, TILE - 4, TILE - 4, 0xffffff, 0.5).setVisible(false).setDepth(10);
        this.fpsText = this.add.text(10, 50, 'FPS: 0', { fontSize: '14px', color: '#00ff00', backgroundColor: '#00000088', padding: {x: 10, y: 10} }).setScrollFactor(0).setDepth(20);

        buildings = []; 
        loadGame().forEach(b => this.createBuilding(b.x, b.y, b.type, false));
        updateUI();

        let isDragging = false;
        this.input.on('pointermove', (p) => {
          if (p.isDown) {
            isDragging = true;
            cam.scrollX -= (p.x - p.prevPosition.x) / cam.zoom;
            cam.scrollY -= (p.y - p.prevPosition.y) / cam.zoom;
          }
        });
        this.input.on('pointerup', (p) => {
          const dist = Phaser.Math.Distance.Between(p.downX, p.downY, p.upX, p.upY);
          if (dist < 15 && selectedBuildingType) this.tryPlaceBuilding(p);
          isDragging = false;
          if (window.preview) window.preview.setVisible(false);
        });
        this.input.on('pointerdown', (p) => {
          if (selectedBuildingType) {
            window.preview.setFillStyle(BUILDINGS[selectedBuildingType].color, 0.6);
            window.preview.setPosition(this.snap(p.worldX), this.snap(p.worldY)).setVisible(true);
          }
        });

        cam.setBounds(0, 0, TILE * GRID, TILE * GRID);
        cam.centerOn(TILE * GRID / 2, TILE * GRID / 2);
        cam.setZoom(0.8);
      }

      update(time, delta) {
        if (this.fpsText) this.fpsText.setText('FPS: ' + Math.round(this.game.loop.actualFps));
        prodTimer += delta;
        if (prodTimer >= 1000) {
          let aG = 0, aE = 0;
          buildings.forEach(b => { aG += BUILDINGS[b.type].prod.gold; aE += BUILDINGS[b.type].prod.elixir; });
          if (aG > 0 || aE > 0) { gold += aG; elixir += aE; updateUI(); }
          prodTimer = 0;
        }
      }

      snap(v) { return Math.floor(v / TILE) * TILE + TILE / 2; }

      tryPlaceBuilding(p) {
        const def = BUILDINGS[selectedBuildingType];
        const x = this.snap(p.worldX);
        const y = this.snap(p.worldY);
        if (x < TILE / 2 || y < TILE / 2 || x > (GRID - 0.5) * TILE || y > (GRID - 0.5) * TILE) return;
        if (buildings.some(b => b.gridX === x && b.gridY === y)) return;
        if (gold < def.cost.gold) { showMessage('Za mało złota!'); return; }
        if (elixir < def.cost.elixir) { showMessage('Za mało eliksiru!'); return; }

        gold -= def.cost.gold; elixir -= def.cost.elixir;
        this.createBuilding(x, y, selectedBuildingType, true);
        updateUI(); saveGame();
      }

      createBuilding(x, y, type, isNew) {
        const def = BUILDINGS[type];
        const container = this.add.container(x, y);
        const rect = this.add.rectangle(0, 0, TILE - 6, TILE - 6, def.color).setStrokeStyle(2, def.stroke);
        const label = this.add.text(0, 0, def.name, { fontSize: '10px', color: '#fff', fontStyle: 'bold' }).setOrigin(0.5);
        
        container.add([rect, label]);
        container.setSize(TILE, TILE).setInteractive({ useHandCursor: true });
        container.type = type; container.gridX = x; container.gridY = y;

        container.on('pointerdown', (pointer, localX, localY, event) => {
          if (event) event.stopPropagation();
          if (selectedBuildingType) return; 
          gold += Math.floor(def.cost.gold * 0.5); elixir += Math.floor(def.cost.elixir * 0.5); updateUI();
          container.destroy();
          buildings = buildings.filter(b => b !== container);
          saveGame();
        });

        buildings.push(container);
        if (isNew && window.preview) window.preview.setVisible(false);
      }
    }

    // --- SCENA WALKI ---
    class BattleScene extends Phaser.Scene {
      constructor() { super('BattleScene'); }
      create() {
        let cam = this.cameras.main;
        cam.setBackgroundColor('#3e1a1a');
        // RESET KAMERY - to gwarantuje, że budynki będą na środku!
        cam.setScroll(0, 0); 
        cam.setZoom(1);

        this.enemyBuildings = [];
        this.troops = [];
        this.armyLeft = 20;
        this.battleEnded = false;

        const cx = cam.width / 2;
        const cy = cam.height / 2;

        this.createEnemyBuilding(cx, cy, 200, 0x8b0000); 
        this.createEnemyBuilding(cx - 120, cy - 100, 100, 0xffd700); 
        this.createEnemyBuilding(cx + 120, cy - 100, 100, 0xffd700); 
        this.createEnemyBuilding(cx, cy + 120, 150, 0x555555); 

        this.input.on('pointerdown', (pointer) => {
          if (this.armyLeft > 0 && !this.battleEnded) {
            this.spawnTroop(pointer.x, pointer.y);
            this.armyLeft--;
            document.getElementById('ui-army').innerText = this.armyLeft;
          }
        });
      }

      createEnemyBuilding(x, y, hp, color) {
        const size = 60;
        const rect = this.add.rectangle(x, y, size, size, color).setStrokeStyle(2, 0x000000);
        this.add.rectangle(x, y - 40, size, 8, 0x000000);
        const hpBar = this.add.rectangle(x - size/2, y - 40, size, 8, 0x00ff00).setOrigin(0, 0.5);
        this.enemyBuildings.push({ sprite: rect, hpBar: hpBar, hp: hp, maxHp: hp, x: x, y: y, alive: true });
      }

      spawnTroop(x, y) {
        const troopSprite = this.add.circle(x, y, 12, 0x1e90ff).setStrokeStyle(2, 0xffffff);
        this.troops.push({ sprite: troopSprite, x: x, y: y, target: null });
      }

      update(time, delta) {
        if (this.battleEnded) return;
        const dt = delta / 1000; 
        this.troops.forEach(troop => {
          if (!troop.target || !troop.target.alive) troop.target = this.findNearestBuilding(troop.x, troop.y);
          if (troop.target) {
            const dist = Phaser.Math.Distance.Between(troop.x, troop.y, troop.target.x, troop.target.y);
            if (dist > TROOP_STATS.range) {
              const angle = Phaser.Math.Angle.Between(troop.x, troop.y, troop.target.x, troop.target.y);
              troop.x += Math.cos(angle) * TROOP_STATS.speed * dt;
              troop.y += Math.sin(angle) * TROOP_STATS.speed * dt;
              troop.sprite.setPosition(troop.x, troop.y);
            } else {
              troop.target.hp -= TROOP_STATS.damage * dt;
              troop.target.hpBar.scaleX = Math.max(0, troop.target.hp / troop.target.maxHp);
              if (troop.target.hp <= 0) {
                troop.target.alive = false;
                troop.target.sprite.destroy(); troop.target.hpBar.destroy();
                troop.target = null; 
              }
            }
          }
        });

        if (this.enemyBuildings.filter(b => b.alive).length === 0) {
          this.battleEnded = true;
          setTimeout(() => endBattle(true), 1000);
        }
      }

      findNearestBuilding(x, y) {
        let nearest = null, minDist = Infinity;
        this.enemyBuildings.forEach(b => {
          if (b.alive) {
            const dist = Phaser.Math.Distance.Between(x, y, b.x, b.y);
            if (dist < minDist) { minDist = dist; nearest = b; }
          }
        });
        return nearest;
      }
    }

    // --- START ---
    const config = {
      type: Phaser.AUTO,
      parent: 'game',
      backgroundColor: '#2d4a3e',
      scale: { mode: Phaser.Scale.RESIZE, autoCenter: Phaser.Scale.CENTER_BOTH },
      scene: [BaseScene, BattleScene]
    };
    const game = new Phaser.Game(config);
  </script>
</body>
</html>
