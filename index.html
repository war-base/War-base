<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>War Base v16</title>
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; background: #1a1a2e; touch-action: none; overscroll-behavior: none; font-family: Arial, sans-serif; }
    #game { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; background-color: #2d4a3e; }

    #top-bar {
      position: absolute; top: 0; left: 0; width: 100%; box-sizing: border-box;
      background: rgba(0, 0, 0, 0.85); color: white; 
      padding: max(12px, env(safe-area-inset-top)) 12px 12px 12px; 
      display: flex; justify-content: space-around; font-weight: bold; font-size: 16px; z-index: 10; pointer-events: none;
    }
    .res-gold { color: #ffd700; }
    .res-elixir { color: #ff69b4; }

    #build-menu {
      position: absolute; bottom: 0; left: 0; width: 100%; box-sizing: border-box;
      background: rgba(0, 0, 0, 0.85); padding: 10px; display: flex; gap: 10px;
      border-top: 2px solid #555; z-index: 10; overflow-x: auto; white-space: nowrap;
      padding-bottom: max(10px, env(safe-area-inset-bottom));
    }
    .build-btn {
      min-width: 80px; padding: 10px 5px; border: none; border-radius: 8px;
      background: #444; color: white; font-weight: bold; font-size: 12px;
      display: flex; flex-direction: column; align-items: center; gap: 5px; pointer-events: auto;
    }
    .build-btn.selected { background: #2d8a4e; border: 2px solid #55ff88; }
    .build-btn:active { background: #666; }
    .btn-sub { font-size: 10px; font-weight: normal; color: #ccc; }
    .btn-sub.gold { color: #ffd700; }
    .btn-sub.elixir { color: #ff69b4; }

    #home-btn {
      position: absolute; bottom: 230px; right: 20px;
      background: #444; color: white; border: 2px solid #888;
      padding: 12px 15px; border-radius: 50px;
      font-size: 20px; font-weight: bold; z-index: 15;
      box-shadow: 0 4px 10px rgba(0,0,0,0.6); cursor: pointer;
    }
    #home-btn:active { background: #222; }

    #attack-btn {
      position: absolute; bottom: 90px; right: 20px;
      background: #cc0000; color: white; border: 2px solid #ff4444;
      padding: 15px 25px; border-radius: 50px;
      font-size: 18px; font-weight: bold; z-index: 15;
      box-shadow: 0 4px 10px rgba(0,0,0,0.6); cursor: pointer;
    }
    #attack-btn:active { background: #990000; transform: scale(0.95); }

    #defend-btn {
      position: absolute; bottom: 160px; right: 20px;
      background: #1e90ff; color: white; border: 2px solid #00bfff;
      padding: 15px 25px; border-radius: 50px;
      font-size: 18px; font-weight: bold; z-index: 15;
      box-shadow: 0 4px 10px rgba(0,0,0,0.6); cursor: pointer;
    }
    #defend-btn:active { background: #104e8b; transform: scale(0.95); }

    #battle-ui, #defense-ui {
      position: absolute; top: 0; left: 0; width: 100%; box-sizing: border-box;
      z-index: 10; pointer-events: none; display: none;
    }
    #battle-top-bar, #defense-top-bar {
      background: rgba(0, 0, 0, 0.85); color: white; 
      padding: max(12px, env(safe-area-inset-top)) 15px 15px 15px;
      display: flex; justify-content: space-between; align-items: center;
      font-size: 16px; font-weight: bold; pointer-events: auto;
    }
    #battle-top-bar button, #defense-top-bar button { background: #cc0000; color: white; border: none; padding: 10px 15px; border-radius: 8px; font-weight: bold; }
    #loot-display { color: #ffd700; }

    #troop-menu {
      position: absolute; bottom: 0; left: 0; width: 100%; box-sizing: border-box;
      background: rgba(0, 0, 0, 0.85); padding: 10px; display: flex; justify-content: space-around; gap: 10px;
      border-top: 2px solid #555; z-index: 10; pointer-events: auto;
      padding-bottom: max(10px, env(safe-area-inset-bottom));
    }
    .troop-btn {
      flex: 1; padding: 10px; border: 2px solid #333; border-radius: 8px;
      background: #222; color: white; font-weight: bold; font-size: 14px;
      display: flex; flex-direction: column; align-items: center; gap: 5px;
    }
    .troop-btn.selected { border: 2px solid #ffd700; background: #444; }

    #building-panel {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.95); color: white; padding: 20px; border-radius: 10px;
      display: none; z-index: 30; text-align: center; min-width: 280px; border: 2px solid #ffd700;
    }
    #building-panel h3 { margin: 0 0 10px 0; color: #ffd700; font-size: 22px; }
    #building-panel p { margin: 5px 0; font-size: 16px; }
    #building-panel button { margin: 5px 0; padding: 10px; font-weight: bold; border-radius: 5px; border: none; cursor: pointer; font-size: 14px; width: 100%; }
    
    #bp-upgrade { background: #2d8a4e; color: white; }
    #bp-sell { background: #8b0000; color: white; }
    #bp-close { background: #555; color: white; }
    #bp-train-section { display: none; margin: 15px 0; padding: 10px; background: rgba(30, 144, 255, 0.2); border-radius: 8px; border: 1px solid #1e90ff; }
    .train-btn { background: #1e90ff; color: white; margin-top: 5px; }
    .train-btn:active { background: #104e8b; }

    /* POPRAWIONY KOMUNIKAT (TOAST) */
    #message {
      position: absolute; 
      top: 12%; 
      left: 50%; 
      transform: translateX(-50%);
      background: rgba(220, 20, 20, 0.95); 
      color: white; 
      padding: 12px 24px;
      border-radius: 30px; 
      font-weight: bold; 
      display: none; 
      pointer-events: none; 
      z-index: 9999;
      text-align: center; 
      font-size: 16px; 
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
      white-space: nowrap;
      border: 2px solid #ff8888;
    }

    #reset-btn {
      position: absolute; top: max(50px, env(safe-area-inset-top)); right: 10px;
      background: rgba(200, 0, 0, 0.7); color: white; border: none;
      padding: 5px 10px; border-radius: 5px; font-size: 12px; z-index: 999;
    }
  </style>
</head>
<body>
  <div id="game"></div>

  <div id="top-bar">
    <div class="res-gold">🪙 Złoto: <span id="ui-gold">1000</span></div>
    <div class="res-elixir">💧 Eliksir: <span id="ui-elixir">1000</span></div>
  </div>
  
  <button id="reset-btn" onclick="resetGame()">RESET</button>

  <div id="build-menu">
    <button class="build-btn" onclick="selectBuilding('townhall')">🏰 Ratusz<span class="btn-sub gold">1000 🪙</span></button>
    <button class="build-btn" onclick="selectBuilding('mine')">⛏️ Kopalnia<span class="btn-sub elixir">150 💧</span></button>
    <button class="build-btn" onclick="selectBuilding('barracks')">⚔️ Koszary<span class="btn-sub elixir">150 💧</span></button>
    <button class="build-btn" onclick="selectBuilding('camp')">⛺ Obóz<span class="btn-sub elixir">250 💧</span></button>
    <button class="build-btn" onclick="selectBuilding('wall')">🧱 Mur<span class="btn-sub gold">50 🪙</span></button>
    <button class="build-btn" onclick="selectBuilding('tower')">🏹 Wieża<span class="btn-sub gold">300 🪙</span></button>
  </div>

  <button id="home-btn" onclick="centerCamera()">🏠</button>
  <button id="attack-btn" onclick="startAttack()">⚔️ Atakuj</button>
  <button id="defend-btn" onclick="startDefense()">🛡️ Broń</button>

  <div id="battle-ui">
    <div id="battle-top-bar">
      <div id="battle-status">Łup: <span id="loot-display">0 🪙, 0 💧</span></div>
      <button onclick="endBattle(false)">Poddaj się</button>
    </div>
    <div id="troop-menu">
      <button class="troop-btn selected" id="btn-troop-barbarian" onclick="selectBattleTroop('barbarian')">
        🗡️ Barbarzyńca<br><span id="ui-barbarian">0</span>
      </button>
      <button class="troop-btn" id="btn-troop-archer" onclick="selectBattleTroop('archer')">
        🏹 Łucznik<br><span id="ui-archer">0</span>
      </button>
      <button class="troop-btn" id="btn-troop-giant" onclick="selectBattleTroop('giant')">
        🛡️ Gigant<br><span id="ui-giant">0</span>
      </button>
    </div>
  </div>

  <div id="defense-ui">
    <div id="defense-top-bar">
      <div id="defense-status">🛡️ Obrona Bazy (Moździerz: Gotowy)</div>
      <button onclick="endDefense(false)">Poddaj się</button>
    </div>
  </div>

  <div id="building-panel">
    <h3 id="bp-name">Budynek</h3>
    <p>Poziom: <span id="bp-level">1</span></p>
    <p id="bp-status-text">Produkcja: <span id="bp-prod">0</span></p>
    
    <div id="bp-train-section">
      <p>Rekrutacja Armii: <span id="bp-army-capacity" style="color:#00ff00"></span></p>
      <button class="train-btn" onclick="trainTroop('barbarian')">🗡️ Barbarzyńca (50 💧)</button>
      <button class="train-btn" onclick="trainTroop('archer')">🏹 Łucznik (75 💧)</button>
      <button class="train-btn" onclick="trainTroop('giant')">🛡️ Gigant (150 💧)</button>
    </div>

    <button id="bp-upgrade" onclick="upgradeBuilding()">Ulepsz</button>
    <button id="bp-sell" onclick="sellBuilding()">Sprzedaj</button>
    <button id="bp-close" onclick="closeBuildingPanel()">Zamknij</button>
  </div>
  
  <div id="message">Za mało surowców!</div>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
  
  <script>
    const TILE = 64; 
    const GRID = 25; 
    
    let gold = 1000;
    let elixir = 1000;
    
    let army = { barbarian: 5, archer: 3, giant: 1 }; 
    let selectedBattleTroopType = 'barbarian';
    
    const BUILDINGS = {
      townhall: { name: 'Ratusz', emoji: '🏰', cost: { gold: 1000, elixir: 0 }, color: 0x8b4513, stroke: 0x5a2d0c, prod: { gold: 0, elixir: 0 }, hp: 1000, buildTime: 60 },
      mine: { name: 'Kopalnia', emoji: '⛏️', cost: { gold: 0, elixir: 150 }, color: 0xffd700, stroke: 0xb8860b, prod: { gold: 10, elixir: 0 }, hp: 400, buildTime: 15 },
      barracks: { name: 'Koszary', emoji: '⚔️', cost: { gold: 0, elixir: 150 }, color: 0x8b0000, stroke: 0x4a0000, prod: { gold: 0, elixir: 5 }, hp: 600, buildTime: 20 },
      camp: { name: 'Obóz', emoji: '⛺', cost: { gold: 0, elixir: 250 }, color: 0x228b22, stroke: 0x006400, prod: { gold: 0, elixir: 0 }, hp: 500, buildTime: 30 },
      wall: { name: 'Mur', emoji: '🧱', cost: { gold: 50, elixir: 0 }, color: 0x808080, stroke: 0x404040, prod: { gold: 0, elixir: 0 }, hp: 500, buildTime: 5 },
      tower: { name: 'Wieża', emoji: '🏹', cost: { gold: 300, elixir: 0 }, color: 0x555555, stroke: 0x000000, prod: { gold: 0, elixir: 0 }, hp: 600, buildTime: 30 }
    };

    const TROOPS = {
      barbarian: { name: 'Barbarzyńca', emoji: '🗡️', hp: 60, damage: 15, speed: 150, range: 40, cost: 50, target: 'any' },
      archer: { name: 'Łucznik', emoji: '🏹', hp: 40, damage: 10, speed: 130, range: 180, cost: 75, target: 'any' },
      giant: { name: 'Gigant', emoji: '🛡️', hp: 400, damage: 25, speed: 60, range: 40, cost: 150, target: 'defense' }
    };

    let selectedBuildingType = null;
    let buildings = [];
    let prodTimer = 0;
    let currentlySelectedBuilding = null;
    let baseSceneInstance = null; 
    let isEndingBattle = false;
    
    let lastGoldWarningTime = 0; 
    let messageTimeout = null;

    let audioCtx = null;
    function playSound(type) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'build') {
          osc.type = 'square';
          osc.frequency.setValueAtTime(150, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.1);
          gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
          osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        } else if (type === 'shoot') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(800, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.1);
          gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
          osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        } else if (type === 'boom') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(100, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 0.3);
          gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
          osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        } else if (type === 'coin') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
          osc.frequency.setValueAtTime(1600, audioCtx.currentTime + 0.05);
          gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
          osc.start(); osc.stop(audioCtx.currentTime + 0.2);
        }
      } catch(e) { console.log("Audio error:", e); }
    }

    // NOWA FUNKCJA SHOWMESSAGE (Zapobiega migotaniu)
    function showMessage(text) {
      const msg = document.getElementById('message');
      if(!msg) return;
      msg.innerText = text;
      msg.style.display = 'block';
      
      if (messageTimeout) clearTimeout(messageTimeout);
      messageTimeout = setTimeout(() => { msg.style.display = 'none'; }, 2500);
    }

    function getMaxArmy() {
      let max = 10; 
      buildings.forEach(b => {
        if (b.type === 'camp') max += 10 * b.level;
      });
      return max;
    }

    function getCurrentArmySize() {
      return army.barbarian + army.archer + army.giant;
    }

    function updateUI() {
      document.getElementById('ui-gold').innerText = Math.floor(gold);
      document.getElementById('ui-elixir').innerText = Math.floor(elixir);
      const btns = document.querySelectorAll('.build-btn');
      if (btns.length >= 6) {
        btns.forEach(btn => btn.classList.remove('selected'));
        if (selectedBuildingType === 'townhall') btns[0].classList.add('selected');
        if (selectedBuildingType === 'mine') btns[1].classList.add('selected');
        if (selectedBuildingType === 'barracks') btns[2].classList.add('selected');
        if (selectedBuildingType === 'camp') btns[3].classList.add('selected');
        if (selectedBuildingType === 'wall') btns[4].classList.add('selected');
        if (selectedBuildingType === 'tower') btns[5].classList.add('selected');
      }
      
      if(document.getElementById('ui-barbarian')) document.getElementById('ui-barbarian').innerText = army.barbarian;
      if(document.getElementById('ui-archer')) document.getElementById('ui-archer').innerText = army.archer;
      if(document.getElementById('ui-giant')) document.getElementById('ui-giant').innerText = army.giant;
      
      if(document.getElementById('bp-army-capacity')) {
        document.getElementById('bp-army-capacity').innerText = `${getCurrentArmySize()} / ${getMaxArmy()}`;
      }
    }

    function resetGame() {
      if (confirm("Na pewno zresetować grę? Stracisz cały postęp.")) {
        localStorage.removeItem('warBaseSave');
        location.reload();
      }
    }

    function selectBuilding(type) {
      selectedBuildingType = (selectedBuildingType === type) ? null : type;
      if (window.preview) window.preview.setVisible(false);
      closeBuildingPanel();
      updateUI();
    }

    function centerCamera() {
      if (!baseSceneInstance) return;
      let target = buildings.find(b => b.type === 'townhall');
      if (!target && buildings.length > 0) target = buildings[0];
      
      let cx = (TILE * GRID) / 2;
      let cy = (TILE * GRID) / 2;
      if (target) { cx = target.x; cy = target.y; }
      
      baseSceneInstance.cameras.main.pan(cx, cy, 300, 'Sine.easeInOut');
    }

    function openBuildingPanel(building) {
      currentlySelectedBuilding = building;
      const def = BUILDINGS[building.type];
      
      document.getElementById('bp-name').innerText = def.name;
      document.getElementById('bp-level').innerText = building.level;
      
      const now = Date.now();
      const isBuilding = building.buildEndTime > now;

      if (isBuilding) {
        const remain = Math.ceil((building.buildEndTime - now) / 1000);
        document.getElementById('bp-status-text').innerHTML = `🔨 W budowie: <span style="color:#ffaa00">${remain}s</span>`;
        document.getElementById('bp-upgrade').style.display = 'none';
        document.getElementById('bp-sell').style.display = 'none';
        document.getElementById('bp-train-section').style.display = 'none';
      } else {
        document.getElementById('bp-status-text').innerHTML = `Produkcja: <span id="bp-prod">0</span>`;
        
        const prodGold = (def.prod.gold || 0) * building.level;
        const prodElixir = (def.prod.elixir || 0) * building.level;
        let prodStr = [];
        if (prodGold > 0) prodStr.push(prodGold + ' 🪙');
        if (prodElixir > 0) prodStr.push(prodElixir + ' 💧');
        document.getElementById('bp-prod').innerText = prodStr.join(' i ') || 'Brak';
        
        const upgradeCostGold = Math.floor(def.cost.gold * building.level * 1.5);
        const upgradeCostElixir = Math.floor(def.cost.elixir * building.level * 1.5);
        document.getElementById('bp-upgrade').innerText = `Ulepsz (${upgradeCostGold} 🪙, ${upgradeCostElixir} 💧)`;
        
        const sellValueGold = Math.floor(def.cost.gold * building.level * 0.5);
        const sellValueElixir = Math.floor(def.cost.elixir * building.level * 0.5);
        document.getElementById('bp-sell').innerText = `Sprzedaj (+${sellValueGold} 🪙, +${sellValueElixir} 💧)`;
        
        document.getElementById('bp-upgrade').style.display = 'block';
        document.getElementById('bp-sell').style.display = 'block';

        if (building.type === 'barracks') {
          document.getElementById('bp-train-section').style.display = 'block';
          updateUI(); 
        } else {
          document.getElementById('bp-train-section').style.display = 'none';
        }
      }
      
      document.getElementById('building-panel').style.display = 'block';
    }

    function trainTroop(type) {
      const barracks = buildings.find(b => b.type === 'barracks' && b.buildEndTime <= Date.now());
      if (!barracks) { showMessage('Brak gotowych Koszar!'); return; }
      
      if (getCurrentArmySize() >= getMaxArmy()) {
        showMessage('Osiągnięto limit armii! Zbuduj Obozy.');
        return;
      }
      
      const cost = TROOPS[type].cost;
      if (elixir < cost) { showMessage('Za mało eliksiru!'); return; }

      elixir -= cost;
      army[type]++;
      playSound('build');
      updateUI(); saveGame();
    }

    function closeBuildingPanel() {
      document.getElementById('building-panel').style.display = 'none';
      currentlySelectedBuilding = null;
    }

    function upgradeBuilding() {
      if (!currentlySelectedBuilding) return;
      const def = BUILDINGS[currentlySelectedBuilding.type];
      
      const townhall = buildings.find(b => b.type === 'townhall');
      if (currentlySelectedBuilding.type !== 'townhall' && townhall && currentlySelectedBuilding.level >= townhall.level) {
        showMessage('Ulepsz najpierw Ratusz na wyższy poziom!');
        return;
      }
      
      const costGold = Math.floor(def.cost.gold * currentlySelectedBuilding.level * 1.5);
      const costElixir = Math.floor(def.cost.elixir * currentlySelectedBuilding.level * 1.5);
      
      if (gold < costGold) { showMessage('Za mało złota!'); return; }
      if (elixir < costElixir) { showMessage('Za mało eliksiru!'); return; }
      
      gold -= costGold; elixir -= costElixir;
      currentlySelectedBuilding.level++;
      playSound('build');
      
      currentlySelectedBuilding.buildEndTime = Date.now() + (def.buildTime * currentlySelectedBuilding.level * 1000);
      currentlySelectedBuilding.rect.setAlpha(0.5);
      currentlySelectedBuilding.icon.setAlpha(0.5);
      currentlySelectedBuilding.label.setAlpha(0.5);
      currentlySelectedBuilding.label.setText(def.name + ' L' + currentlySelectedBuilding.level);
      
      updateUI(); saveGame(); openBuildingPanel(currentlySelectedBuilding); 
    }

    function sellBuilding() {
      if (!currentlySelectedBuilding) return;
      const def = BUILDINGS[currentlySelectedBuilding.type];
      const refundGold = Math.floor(def.cost.gold * currentlySelectedBuilding.level * 0.5);
      const refundElixir = Math.floor(def.cost.elixir * currentlySelectedBuilding.level * 0.5);
      
      gold += refundGold; elixir += refundElixir;
      currentlySelectedBuilding.destroy();
      buildings = buildings.filter(b => b !== currentlySelectedBuilding);
      
      updateUI(); saveGame(); closeBuildingPanel();
    }

    function saveGame() {
      const data = { 
        version: 16, 
        gold: gold, 
        elixir: elixir, 
        army: army, 
        buildings: buildings.map(b => ({ 
          x: b.x, y: b.y, type: b.type, level: b.level, hp: b.hp, maxHp: b.maxHp, buildEndTime: b.buildEndTime 
        })) 
      };
      localStorage.setItem('warBaseSave', JSON.stringify(data));
    }

    function loadGame() {
      const saved = localStorage.getItem('warBaseSave');
      if (saved) {
        try {
          const data = JSON.parse(saved);
          if (data.version === 16 && typeof data.gold === 'number') {
            gold = data.gold; 
            elixir = data.elixir; 
            army = data.army || { barbarian: 5, archer: 3, giant: 1 };
            return data.buildings || []; 
          } else { localStorage.removeItem('warBaseSave'); }
        } catch (e) { localStorage.removeItem('warBaseSave'); }
      }
      return [];
    }

    function selectBattleTroop(type) {
      selectedBattleTroopType = type;
      document.querySelectorAll('.troop-btn').forEach(btn => btn.classList.remove('selected'));
      document.getElementById('btn-troop-' + type).classList.add('selected');
    }

    function startAttack() {
      closeBuildingPanel();
      if (getCurrentArmySize() <= 0) { showMessage('Nie masz wojska!'); return; }
      
      document.getElementById('build-menu').style.display = 'none';
      document.getElementById('home-btn').style.display = 'none';
      document.getElementById('attack-btn').style.display = 'none';
      document.getElementById('defend-btn').style.display = 'none';
      document.getElementById('top-bar').style.display = 'none';
      document.getElementById('battle-ui').style.display = 'block';
      
      selectBattleTroop('barbarian'); 
      updateUI();
      isEndingBattle = false; 
      playSound('build');
      game.scene.start('BattleScene');
    }

    function endBattle(won = false, lootGold = 0, lootElixir = 0) {
      if (isEndingBattle) return; 
      isEndingBattle = true;

      army = { barbarian: 0, archer: 0, giant: 0 }; 
      
      if (won) {
        gold += 500 + lootGold; 
        elixir += 200 + lootElixir; 
        playSound('coin');
      } else {
        gold += lootGold; elixir += lootElixir;
      }
      updateUI(); saveGame();
      
      if (won) {
        alert(`Zwycięstwo!\nZdobyto łup: ${500 + lootGold} 🪙 i ${200 + lootElixir} 💧\n\nKliknij OK, aby wrócić do bazy.`);
      } else {
        alert(`Wycofano wojska.\nUratowany łup: ${lootGold} 🪙 i ${lootElixir} 💧\n\nKliknij OK, aby wrócić do bazy.`);
      }
      
      window.location.reload();
    }

      saveGame(); 
      
      document.getElementById('build-menu').style.display = 'none';
      document.getElementById('home-btn').style.display = 'none';
      document.getElementById('attack-btn').style.display = 'none';

    function endDefense(won) {
      const defenseScene = game.scene.getScene('DefenseScene');
      if (defenseScene) {
        const survivingBuildings = defenseScene.playerBuildings
          .filter(b => b.alive)
          .map(b => ({ x: b.x, y: b.y, type: b.type, level: b.level, hp: b.hp, maxHp: b.maxHp, buildEndTime: b.buildEndTime }));
          
        let data = JSON.parse(localStorage.getItem('warBaseSave'));
        if (!data) data = { version: 16, gold: 1000, elixir: 1000, army: { barbarian: 0, archer: 0, giant: 0 }, buildings: [] };
        data.buildings = survivingBuildings;
        
        if (won) {
          data.gold += 300;
          data.elixir += 150;
          playSound('coin');
        }
        
        localStorage.setItem('warBaseSave', JSON.stringify(data));
      }

      window.location.reload();

    class BaseScene extends Phaser.Scene {
      constructor() { super('BaseScene'); }
      create() {
        baseSceneInstance = this; 
        let cam = this.cameras.main;
        
        let grid = this.add.grid(0, 0, TILE * GRID, TILE * GRID, TILE, TILE, 0x2d4a3e, 1, 0x5a8a6e, 1);
        grid.setOrigin(0, 0);

        window.preview = this.add.rectangle(0, 0, TILE - 4, TILE - 4, 0xffffff, 0.5).setVisible(false).setDepth(10);
        this.fpsText = this.add.text(10, 50, 'FPS: 0', { fontSize: '14px', color: '#00ff00', backgroundColor: '#00000088', padding: {x: 10, y: 10} }).setScrollFactor(0).setDepth(20);

        buildings = []; 
        try {
          loadGame().forEach(b => this.createBuilding(b.x, b.y, b.type, false, b.level || 1, b.hp || null, b.buildEndTime || 0));
        } catch (e) {
          console.error("Błąd wczytywania bazy:", e);
        }
        updateUI();

        this.lastGridX = -1;
        this.lastGridY = -1;

        this.input.on('pointerdown', (p) => {
          this.lastGridX = -1; 
          this.lastGridY = -1;
          
          if (selectedBuildingType) {
            if (selectedBuildingType === 'wall') {
              this.tryPlaceBuilding(p);
            }
          }
        });

        this.input.on('pointermove', (p) => {
          if (selectedBuildingType) {
            if (window.preview) {
              window.preview.setFillStyle(BUILDINGS[selectedBuildingType].color, 0.6);
              window.preview.setPosition(this.snap(p.worldX), this.snap(p.worldY)).setVisible(true);
            }
            
            if (selectedBuildingType === 'wall' && p.isDown) {
              this.tryPlaceBuilding(p);
            }
          } else if (p.isDown) {
            cam.scrollX -= (p.x - p.prevPosition.x) / cam.zoom;
            cam.scrollY -= (p.y - p.prevPosition.y) / cam.zoom;
          }
        });

        this.input.on('pointerup', (p) => {
          if (selectedBuildingType && selectedBuildingType !== 'wall') {
            this.tryPlaceBuilding(p);
          }
          if (window.preview) window.preview.setVisible(false);
        });

        cam.setBounds(0, 0, TILE * GRID, TILE * GRID);
        cam.setZoom(1.0); 
        centerCamera(); 
      }

      update(time, delta) {
        if (this.fpsText) this.fpsText.setText('FPS: ' + Math.round(this.game.loop.actualFps));
        
        let now = Date.now();
        buildings.forEach(b => {
          if (b.buildEndTime > now) {
            let rem = Math.ceil((b.buildEndTime - now) / 1000);
            b.buildText.setText('🔨 ' + rem + 's');
          } else if (b.buildEndTime > 0) {
            b.buildEndTime = 0;
            b.buildText.setText('');
            b.rect.setAlpha(1); b.icon.setAlpha(1); b.label.setAlpha(1);
            saveGame();
            if (currentlySelectedBuilding === b) openBuildingPanel(b);
          }
        });

        prodTimer += delta;
        if (prodTimer >= 1000) {
          let aG = 0, aE = 0;
          buildings.forEach(b => {
            if (b.buildEndTime <= now) {
              aG += (BUILDINGS[b.type].prod.gold || 0) * b.level;
              aE += (BUILDINGS[b.type].prod.elixir || 0) * b.level;
            }
          });
          if (aG > 0 || aE > 0) { gold += aG; elixir += aE; updateUI(); }
          prodTimer = 0;
        }
      }

      snap(v) { return Math.floor(v / TILE) * TILE + TILE / 2; }

      tryPlaceBuilding(p) {
        const def = BUILDINGS[selectedBuildingType];
        const x = this.snap(p.worldX);
        const y = this.snap(p.worldY);
        
        if (x === this.lastGridX && y === this.lastGridY) return;
        
        if (x < TILE / 2 || y < TILE / 2 || x > (GRID - 0.5) * TILE || y > (GRID - 0.5) * TILE) return;
        if (buildings.some(b => b.gridX === x && b.gridY === y)) return;
        
        if (gold < def.cost.gold) { 
          if (Date.now() > lastGoldWarningTime) {
            showMessage('Za mało złota!');
            lastGoldWarningTime = Date.now() + 1500; 
          }
          return; 
        }
        if (elixir < def.cost.elixir) { showMessage('Za mało eliksiru!'); return; }

        gold -= def.cost.gold; elixir -= def.cost.elixir;
        playSound('build');
        this.createBuilding(x, y, selectedBuildingType, true, 1);
        
        this.lastGridX = x; 
        this.lastGridY = y;
        
        updateUI(); saveGame();
      }

      createBuilding(x, y, type, isNew, level, hp = null, buildEndTime = 0) {
        const def = BUILDINGS[type];
        const container = this.add.container(x, y);
        
        const rect = this.add.rectangle(0, 0, TILE - 4, TILE - 4, def.color).setStrokeStyle(2, def.stroke);
        const icon = this.add.text(0, -5, def.emoji, { fontSize: '32px' }).setOrigin(0.5);
        const label = this.add.text(0, 20, def.name + ' L' + level, { fontSize: '11px', color: '#fff', fontStyle: 'bold' }).setOrigin(0.5);
        const buildText = this.add.text(0, -35, '', { fontSize: '18px', color: '#ffaa00', fontStyle: 'bold', backgroundColor: '#00000088' }).setOrigin(0.5);

        const hpBarBg = this.add.rectangle(0, -TILE/2 + 6, TILE - 8, 8, 0x000000);
        const hpBar = this.add.rectangle(-(TILE - 8)/2, -TILE/2 + 6, TILE - 8, 8, 0x00ff00).setOrigin(0, 0.5);
        
        container.add([rect, icon, label, hpBarBg, hpBar, buildText]);
        container.setSize(TILE, TILE).setInteractive({ useHandCursor: true });
        container.type = type; container.gridX = x; container.gridY = y; container.level = level;
        container.label = label; container.hpBar = hpBar; container.rect = rect; container.icon = icon; container.buildText = buildText;

        container.buildEndTime = isNew ? Date.now() + (def.buildTime * level * 1000) : buildEndTime;

        if (container.buildEndTime > Date.now()) {
          rect.setAlpha(0.5); icon.setAlpha(0.5); label.setAlpha(0.5);
        }

        container.hp = hp !== null ? hp : def.hp * level;
        container.maxHp = def.hp * level;
        container.hpBar.scaleX = container.hp / container.maxHp;

        container.on('pointerdown', (pointer, localX, localY, event) => {
          if (event) event.stopPropagation();
          if (selectedBuildingType) return; 
          openBuildingPanel(container);
        });

        buildings.push(container);
        if (isNew && window.preview) window.preview.setVisible(false);
      }
    }

    class BattleScene extends Phaser.Scene {
      constructor() { super('BattleScene'); }
      create() {
        let cam = this.cameras.main;
        cam.setBackgroundColor('#3e1a1a');
        cam.setScroll(0, 0); cam.setZoom(1);

        this.enemyBuildings = [];
        this.troops = [];
        this.battleEnded = false;
        this.lootGold = 0;
        this.lootElixir = 0;
        this.lastDamageText = 0;

        document.getElementById('loot-display').innerText = '0 🪙, 0 💧';

        const cx = window.innerWidth / 2;
        const cy = window.innerHeight / 2;

        // --- LOSOWA GENERACJA BAZY WROGA ---
        // Zawsze jest Ratusz na środku
        this.createEnemyBuilding(cx, cy, 400, 0x8b0000, 'Ratusz', '🏰', false, 200, 100); 

        // Dodajemy 6-9 losowych budynków wokół
        let numBuildings = Phaser.Math.Between(6, 9);
        for(let i = 0; i < numBuildings; i++) {
            let ex, ey, valid, attempts = 0;
            do {
                // Losowa pozycja w promieniu od 120 do 220 px od środka
                let angle = Phaser.Math.FloatBetween(0, Math.PI * 2);
                let dist = Phaser.Math.Between(120, 220);
                ex = cx + Math.cos(angle) * dist;
                ey = cy + Math.sin(angle) * dist;
                
                valid = true;
                for (let b of this.enemyBuildings) {
                    if (Phaser.Math.Distance.Between(ex, ey, b.x, b.y) < 80) { valid = false; break; }
                }
                attempts++;
            } while(!valid && attempts < 20);
            
            if (valid) {
                let typeRnd = Phaser.Math.Between(1, 10);
                if (typeRnd <= 3) {
                    this.createEnemyBuilding(ex, ey, 150, 0x555555, 'Wieża', '🏹', true, 0, 0);
                } else if (typeRnd <= 6) {
                    this.createEnemyBuilding(ex, ey, 100, 0xffd700, 'Kopalnia', '⛏️', false, 300, 0);
                } else if (typeRnd <= 8) {
                    this.createEnemyBuilding(ex, ey, 150, 0x8b0000, 'Koszary', '⚔️', false, 0, 200);
                } else {
                    this.createEnemyBuilding(ex, ey, 250, 0x808080, 'Mur', '🧱', false, 0, 0);
                }
            }
        }

        this.time.addEvent({ delay: 1500, loop: true, callback: this.towersShoot, callbackScope: this });

        this.input.on('pointerdown', (pointer) => {
          if (this.battleEnded) return;
          
          if (army[selectedBattleTroopType] > 0) {
            this.spawnTroop(pointer.x, pointer.y, selectedBattleTroopType);
            army[selectedBattleTroopType]--;
            updateUI();
            playSound('shoot');
          } else {
            showMessage("Brak tej jednostki!");
          }
        });
      }

      createEnemyBuilding(x, y, hp, color, name, emoji, isDefense, lootG, lootE) {
        const size = 60;
        const rect = this.add.rectangle(x, y, size, size, color).setStrokeStyle(2, 0x000000);
        this.add.text(x, y - 5, emoji, {fontSize: '32px'}).setOrigin(0.5);
        this.add.text(x, y + 20, name, {fontSize: '11px', color: '#fff'}).setOrigin(0.5);
        this.add.rectangle(x, y - 40, size, 8, 0x000000);
        const hpBar = this.add.rectangle(x - size/2, y - 40, size, 8, 0x00ff00).setOrigin(0, 0.5);
        this.enemyBuildings.push({ 
          sprite: rect, hpBar: hpBar, hp: hp, maxHp: hp, x: x, y: y, alive: true, 
          isDefense: isDefense, lootG: lootG, lootE: lootE 
        });
      }

      spawnTroop(x, y, type) {
        const def = TROOPS[type];
        const troopSprite = this.add.text(x, y, def.emoji, { fontSize: '28px' }).setOrigin(0.5);
        const hpBar = this.add.rectangle(x - 12, y - 24, 24, 4, 0x00ff00).setOrigin(0, 0.5);
        this.troops.push({ type: type, def: def, sprite: troopSprite, hpBar: hpBar, x: x, y: y, target: null, hp: def.hp, maxHp: def.hp });
      }

      showDamageText(x, y, amount) {
        let dmgText = this.add.text(x, y - 30, '-' + Math.floor(amount), { fontSize: '18px', color: '#ff4444', fontStyle: 'bold' }).setOrigin(0.5);
        this.tweens.add({
          targets: dmgText, y: y - 70, alpha: 0, duration: 800, onComplete: () => dmgText.destroy()
        });
      }

      explode(x, y, color) {
        let blast = this.add.circle(x, y, 20, color, 0.8);
        this.tweens.add({
          targets: blast, scale: 3, alpha: 0, duration: 400, onComplete: () => blast.destroy()
        });
      }

      towersShoot() {
        if (this.battleEnded) return;
        this.enemyBuildings.forEach(tower => {
          if (tower.alive && tower.isDefense) {
            let nearestTroop = null;
            let minDist = 300; 
            this.troops.forEach(troop => {
              const dist = Phaser.Math.Distance.Between(tower.x, tower.y, troop.x, troop.y);
              if (dist < minDist) { minDist = dist; nearestTroop = troop; }
            });

            if (nearestTroop) {
              const laser = this.add.line(0, 0, tower.x, tower.y, nearestTroop.x, nearestTroop.y, 0xff0000);
              laser.setOrigin(0, 0); laser.setLineWidth(4); 
              setTimeout(() => laser.destroy(), 150); 
              nearestTroop.hp -= 25;
              this.showDamageText(nearestTroop.x, nearestTroop.y, 25);
              playSound('shoot');
            }
          }
        });
      }

      update(time, delta) {
        if (this.battleEnded) return;
        const dt = delta / 1000; 

        for (let i = this.troops.length - 1; i >= 0; i--) {
          let troop = this.troops[i];
          if (troop.hp <= 0) {
            troop.sprite.destroy(); troop.hpBar.destroy(); this.troops.splice(i, 1); continue;
          }
          troop.hpBar.width = 24 * (troop.hp / troop.maxHp);
          troop.hpBar.setPosition(troop.x - 12, troop.y - 24);

          if (!troop.target || !troop.target.alive) troop.target = this.findNearestBuilding(troop.x, troop.y, troop.def.target);
          
          if (troop.target) {
            const dist = Phaser.Math.Distance.Between(troop.x, troop.y, troop.target.x, troop.target.y);
            if (dist > troop.def.range) {
              const angle = Phaser.Math.Angle.Between(troop.x, troop.y, troop.target.x, troop.target.y);
              troop.x += Math.cos(angle) * troop.def.speed * dt;
              troop.y += Math.sin(angle) * troop.def.speed * dt;
              troop.sprite.setPosition(troop.x, troop.y);
            } else {
              let dmg = troop.def.damage * dt;
              troop.target.hp -= dmg;
              troop.target.hpBar.scaleX = Math.max(0, troop.target.hp / troop.target.maxHp);
              
              if (time > this.lastDamageText + 200) {
                this.showDamageText(troop.target.x + Phaser.Math.Between(-20, 20), troop.target.y, dmg * 5); 
                this.lastDamageText = time;
              }

              if (troop.type === 'archer' && Math.random() < 0.1) {
                const arrow = this.add.line(0, 0, troop.x, troop.y, troop.target.x, troop.target.y, 0xffffff);
                arrow.setOrigin(0,0); setTimeout(() => arrow.destroy(), 100);
                playSound('shoot');
              }

              if (troop.target.hp <= 0) {
                troop.target.alive = false; 
                this.explode(troop.target.x, troop.target.y, 0xffaa00);
                playSound('boom');
                troop.target.sprite.destroy(); 
                troop.target.hpBar.destroy(); 
                
                if (troop.target.lootG > 0 || troop.target.lootE > 0) {
                  this.lootGold += troop.target.lootG;
                  this.lootElixir += troop.target.lootE;
                  document.getElementById('loot-display').innerText = `${this.lootGold} 🪙, ${this.lootElixir} 💧`;
                  this.showDamageText(troop.target.x, troop.target.y, '+' + troop.target.lootG + ' 🪙');
                  playSound('coin');
                }
                troop.target = null; 
              }
            }
          }
        }

        if (this.enemyBuildings.filter(b => b.alive).length === 0) {
          this.battleEnded = true;
          setTimeout(() => endBattle(true, this.lootGold, this.lootElixir), 1000);
        } else if (army.barbarian + army.archer + army.giant === 0 && this.troops.length === 0 && !this.battleEnded) {
          this.battleEnded = true;
          setTimeout(() => endBattle(false, this.lootGold, this.lootElixir), 1000);
        }
      }

      findNearestBuilding(x, y, targetType) {
        let nearest = null, minDist = Infinity;
        this.enemyBuildings.forEach(b => {
          if (b.alive) {
            const hasDefenses = this.enemyBuildings.some(eb => eb.alive && eb.isDefense);
            if (targetType === 'defense' && hasDefenses && !b.isDefense) return;

            const dist = Phaser.Math.Distance.Between(x, y, b.x, b.y);
            if (dist < minDist) { minDist = dist; nearest = b; }
          }
        });
        return nearest;
      }
    }

    class DefenseScene extends Phaser.Scene {
      constructor() { super('DefenseScene'); }
      
      create() {
        let cam = this.cameras.main;
        cam.setBackgroundColor('#2d4a3e');
        let grid = this.add.grid(0, 0, TILE * GRID, TILE * GRID, TILE, TILE, 0x2d4a3e, 1, 0x5a8a6e, 1);
        grid.setOrigin(0, 0);
        
        this.playerBuildings = [];
        const saved = loadGame(); 
        
        saved.forEach(b => {
          const def = BUILDINGS[b.type];
          const container = this.add.container(b.x, b.y);
          const rect = this.add.rectangle(0, 0, TILE - 4, TILE - 4, def.color).setStrokeStyle(2, def.stroke);
          const icon = this.add.text(0, -5, def.emoji, { fontSize: '32px' }).setOrigin(0.5);
          const label = this.add.text(0, 20, def.name + ' L' + b.level, { fontSize: '11px', color: '#fff' }).setOrigin(0.5);
          
          const hpBarBg = this.add.rectangle(0, -TILE/2 + 6, TILE - 8, 8, 0x000000);
          const hpBar = this.add.rectangle(-(TILE - 8)/2, -TILE/2 + 6, TILE - 8, 8, 0x00ff00).setOrigin(0, 0.5);
          container.add([rect, icon, label, hpBarBg, hpBar]);
          
          this.playerBuildings.push({
            sprite: container, rect: rect, hpBar: hpBar, x: b.x, y: b.y, hp: b.hp, maxHp: b.maxHp, type: b.type, level: b.level, alive: true, isDefense: (b.type === 'tower'), buildEndTime: b.buildEndTime
          });
        });
        
        const townhall = this.playerBuildings.find(b => b.type === 'townhall');
        let centerX = townhall ? townhall.x : (this.playerBuildings.length > 0 ? this.playerBuildings[0].x : TILE * GRID / 2);
        let centerY = townhall ? townhall.y : (this.playerBuildings.length > 0 ? this.playerBuildings[0].y : TILE * GRID / 2);
        
        cam.setBounds(0, 0, TILE * GRID, TILE * GRID);
        cam.setZoom(1.0);
        cam.scrollX = centerX - cam.width / 2 / cam.zoom;
        cam.scrollY = centerY - cam.height / 2 / cam.zoom;
        
        this.centerBase = { x: centerX, y: centerY };

        this.enemies = [];
        this.waveCount = 0;
        this.battleEnded = false;
        this.mortarCooldown = 0; 
        
        this.spawnWave();
        
        this.time.addEvent({
          delay: 1500, loop: true, callback: () => {
            if (this.battleEnded) return;
            this.playerBuildings.forEach(tower => {
              if (tower.alive && tower.isDefense && tower.buildEndTime <= Date.now()) {
                let target = this.enemies.find(e => e.alive && Phaser.Math.Distance.Between(tower.x, tower.y, e.x, e.y) < 400);
                if (target) {
                  const laser = this.add.line(0, 0, tower.x, tower.y, target.x, target.y, 0x00ffff);
                  laser.setOrigin(0, 0); laser.setLineWidth(5); 
                  setTimeout(() => laser.destroy(), 150); 
                  target.hp -= 30; 
                  playSound('shoot');
                }
              }
            });
          }
        });

        this.input.on('pointerdown', (pointer) => {
          if (this.battleEnded || this.mortarCooldown > 0) return;
          
          const clickX = pointer.worldX;
          const clickY = pointer.worldY;
          
          const blast = this.add.circle(clickX, clickY, 80, 0xffaa00, 0.6);
          this.time.delayedCall(200, () => blast.destroy());
          playSound('boom');
          
          this.enemies.forEach(enemy => {
            if (!enemy.alive) return;
            const dist = Phaser.Math.Distance.Between(clickX, clickY, enemy.x, enemy.y);
            if (dist <= 80) enemy.hp -= 100;
          });
          
          this.mortarCooldown = 3000;
          document.getElementById('defense-status').innerText = '🛡️ Obrona Bazy (Moździerz: 3s)';
          
          this.time.addEvent({
            delay: 1000, repeat: 2, callback: () => {
              if (this.battleEnded) return;
              this.mortarCooldown -= 1000;
              if (this.mortarCooldown <= 0) {
                document.getElementById('defense-status').innerText = '🛡️ Obrona Bazy (Moździerz: Gotowy)';
              } else {
                document.getElementById('defense-status').innerText = `🛡️ Obrona Bazy (Moździerz: ${this.mortarCooldown/1000}s)`;
              }
            }
          });
        });
        
        this.time.addEvent({
          delay: 10000, loop: true, callback: () => {
            if (!this.battleEnded) this.spawnWave();
          }
        });
      }
      
      spawnWave() {
        this.waveCount++;
        const numEnemies = 2 + this.waveCount * 2; 
        
        for (let i = 0; i < numEnemies; i++) {
          const angle = Phaser.Math.FloatBetween(0, Math.PI * 2);
          const distance = Phaser.Math.Between(400, 600); 
          
          const x = this.centerBase.x + Math.cos(angle) * distance;
          const y = this.centerBase.y + Math.sin(angle) * distance;
          
          const sprite = this.add.text(x, y, '👹', { fontSize: '32px' }).setOrigin(0.5);
          const hpBar = this.add.rectangle(x - 12, y - 24, 24, 4, 0x00ff00).setOrigin(0, 0.5);
          
          this.enemies.push({
            sprite, hpBar, x, y, hp: 100, maxHp: 100, target: null, alive: true, damage: 15, speed: 80
          });
        }
      }
      
      update(time, delta) {
        if (this.battleEnded) return;
        const dt = delta / 1000;
        
        for (let i = this.enemies.length - 1; i >= 0; i--) {
          let enemy = this.enemies[i];
          if (enemy.hp <= 0) {
            enemy.alive = false; enemy.sprite.destroy(); enemy.hpBar.destroy(); this.enemies.splice(i, 1); continue;
          }
          enemy.hpBar.width = 24 * (enemy.hp / enemy.maxHp);
          enemy.hpBar.setPosition(enemy.x - 12, enemy.y - 24);
          
          if (!enemy.target || !enemy.target.alive) {
            let nearest = null, minDist = Infinity;
            this.playerBuildings.forEach(b => {
              if (b.alive) {
                const dist = Phaser.Math.Distance.Between(enemy.x, enemy.y, b.x, b.y);
                if (dist < minDist) { minDist = dist; nearest = b; }
              }
            });
            enemy.target = nearest;
          }
          
          if (enemy.target) {
            const dist = Phaser.Math.Distance.Between(enemy.x, enemy.y, enemy.target.x, enemy.target.y);
            if (dist > 40) {
              const angle = Phaser.Math.Angle.Between(enemy.x, enemy.y, enemy.target.x, enemy.target.y);
              enemy.x += Math.cos(angle) * enemy.speed * dt;
              enemy.y += Math.sin(angle) * enemy.speed * dt;
              enemy.sprite.setPosition(enemy.x, enemy.y);
            } else {
              enemy.target.hp -= enemy.damage * dt;
              enemy.target.hpBar.scaleX = Math.max(0, enemy.target.hp / enemy.target.maxHp);
              if (enemy.target.hp <= 0) {
                enemy.target.alive = false;
                enemy.target.sprite.destroy();
                enemy.target = null;
                playSound('boom');
              }
            }
          }
        }
        
        const alivePlayerBuildings = this.playerBuildings.filter(b => b.alive);
        if (alivePlayerBuildings.length === 0) {
          this.battleEnded = true;
          setTimeout(() => endDefense(false), 1000);
        } else if (this.waveCount >= 3 && this.enemies.length === 0) {
          this.battleEnded = true;
          setTimeout(() => endDefense(true), 1000);
        }
      }
    }

    const config = {
      type: Phaser.CANVAS, 
      parent: 'game',
      width: window.innerWidth,
      height: window.innerHeight,
      backgroundColor: '#2d4a3e',
      render: { clearBeforeRender: false },
      scene: [BaseScene, BattleScene, DefenseScene]
    };
    const game = new Phaser.Game(config);
  </script>
</body>
