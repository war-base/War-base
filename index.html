<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Test</title>
  <style>
    body { margin: 0; padding: 0; overflow: hidden; background: #000; }
  </style>
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
  <script>
    var config = {
      type: Phaser.CANVAS, // Wymuszamy tryb Canvas (bez WebGL)
      width: window.innerWidth,
      height: window.innerHeight,
      backgroundColor: '#2d4a3e',
      scene: {
        create: create
      }
    };
    var game = new Phaser.Game(config);

    function create() {
      // Rysujemy wielki czerwony kwadrat na środku
      this.add.rectangle(window.innerWidth / 2, window.innerHeight / 2, 200, 200, 0xff0000);
      // Dodajemy biały napis
      this.add.text(50, 100, 'DZIAŁA!', { fontSize: '40px', color: '#ffffff', fontStyle: 'bold' });
    }
  </script>
</body>
</html>
