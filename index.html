<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>War Base - Prototyp 2</title>
  <style>
    html, body { 
      margin: 0; padding: 0; overflow: hidden; 
      background: #1a1a2e; touch-action: none; overscroll-behavior: none; 
      font-family: Arial, sans-serif; 
    }
    
    /* Mapa zajmuje cały ekran, jest pod interfejsem (z-index: 1) */
    #game { 
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; 
      z-index: 1; 
    }

    /* Górny pasek surowców (z-index: 10, na wierzchu) */
    #top-bar {
      position: absolute; top: 0; left: 0; width: 100%; box-sizing: border-box;
      background: rgba(0, 0, 0, 0.75); color: white;
      padding: 12px; display: flex; justify-content: space-around; 
      font-weight: bold; font-size: 16px; z-index: 10;
      pointer-events: none; /* Przepuszcza dotyk w miejsca puste, ale same napisy są widoczne */
    }
    
    .res-gold { color: #ffd700; }
    .res-elixir { color: #ff69b4; }

    /* Dolne menu budowy */
    #build-menu {
      position: absolute; bottom: 0; left: 0; width: 100%; box-sizing: border-box;
      background: rgba(0, 0, 0, 0.85); padding: 10px;
      display: flex; justify-content: space-around; gap: 10px;
      border-top: 2px solid #555; z-index: 10;
    }

    .build-btn {
      flex: 1; padding: 10px 5px; border: none; border-radius: 8px;
      background: #444; color: white; font-weight: bold; font-size: 12px;
      display: flex; flex-direction: column; align-items: center; gap: 5px;
      pointer-events: auto; /* Przyciski muszą łapać dotyk */
    }
    
    .build-btn.selected { background: #2d8a4e; border: 2px solid #55ff88; }
    .build-btn:active { background: #666; }
    
    .btn-sub { font-size: 10px; font-weight: normal; color: #ccc; }
    .btn-sub.gold { color: #ffd700; }
    .btn-sub.elixir { color: #ff69b4; }

    /* Komunikat */
    #message {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: rgba(200, 0, 0, 0.9); color: white; padding: 10px 20px;
      border-radius: 8px; font-weight: bold; display: none; pointer-events: none;
      z-index: 20;
    }
  </style>
</head>
<body>
  <div id="game"></div>

  <div id="top-bar">
    <div class="res-gold">🪙 Złoto: <span id="ui-gold">1000</span></div>
    <div class="res-elixir">💧 Eliksir: <span id="ui-elixir">1000</span></div>
  </div>
  
  <div id="build-menu">
    <button class="build-btn" onclick="selectBuilding('townhall')">
      🏰 Ratusz
      <span class="btn-sub gold">1000 🪙</span>
    </button>
    <button class="build-btn" onclick="selectBuilding('mine')">
      ⛏️ Kopalnia
      <span class="btn-sub elixir">150 💧</span>
    </button>
    <button class="build-btn" onclick="selectBuilding('barracks')">
      ⚔️ Koszary
      <span class="btn-sub elixir">300 💧</span>
    </button>
  </div>
  
  <div id="message">Za mało surowców!</div>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
  
  <script>
    let gold = 1000;
    let elixir = 1000;
    
    const BUILDINGS = {
      townhall: { name: 'Ratusz', cost: { gold: 1000, elixir: 0 }, color: 0x8b4513, stroke: 0x5a2d0c },
      mine: { name: 'Kopalnia', cost: { gold: 0, elixir: 150 }, color: 0xffd700, stroke: 0xb8860b },
      barracks: { name: 'Koszary', cost: { gold: 0, elixir: 300 }, color: 0x8b0000, stroke: 0x4a0000 }
    };
    
    let selectedBuildingType = null;

    function updateUI() {
      const gEl = document.getElementById('ui-gold');
      const eEl = document.getElementById('ui-elixir');
      if (gEl) gEl.innerText = gold;
      if (eEl) eEl.innerText = elixir;
      
      const btns = document.querySelectorAll('.build-btn');
      if (btns.length >= 3) {
        btns.forEach(btn => btn.classList.remove('selected'));
        if (selectedBuildingType === 'townhall') btns[0].classList.add('selected');
        if (selectedBuildingType === 'mine') btns[1].classList.add('selected');
        if (selectedBuildingType === 'barracks') btns[2].classList.add('selected');
      }
    }

    function selectBuilding(type) {
      if (selectedBuildingType === type) {
        selectedBuildingType = null;
        if (window.preview) window.preview.setVisible(false);
      } else {
        selectedBuildingType = type;
      }
      updateUI();
    }
    
    function showMessage(text) {
      const msg = document.getElementById('message');
      if (!msg) return;
      msg.innerText = text;
      msg.style.display = 'block';
      setTimeout(() => { msg.style.display = 'none'; }, 1500);
    }

    const TILE = 64; 
    const GRID = 25; 

    const config = {
      type: Phaser.AUTO,
      parent: 'game',
      backgroundColor: '#2d4a3e',
      scale: {
        mode: Phaser.Scale.RESIZE,
        autoCenter: Phaser.Scale.CENTER_BOTH
      },
      scene: { create, update }
    };

    let cam, buildings = [], preview, fpsText, isDragging = false;

    function create() {
      cam = this.cameras.main;
      cam.setZoom(0.8);

      // Rysowanie siatki
      let gridGraphics = this.add.graphics();
      gridGraphics.lineStyle(1, 0x3d6b55, 1);
      for (let i = 0; i <= GRID; i++) {
        gridGraphics.lineBetween(i * TILE, 0, i * TILE, GRID * TILE);
        gridGraphics.lineBetween(0, i * TILE, GRID * TILE, i * TILE);
      }

      // Podgląd budynku
      preview = this.add.rectangle(0, 0, TILE - 4, TILE - 4, 0xffffff, 0.5)
        .setVisible(false).setDepth(10);
      
      window.preview = preview; // Referencja globalna dla HTML

      fpsText = this.add.text(10, 50, 'FPS: 0', { 
        fontSize: '14px', color: '#00ff00', backgroundColor: '#00000088', padding: {x: 10, y: 10} 
      }).setScrollFactor(0).setDepth(20);

      // --- OBSŁUGA DOTYKU ---
      this.input.on('pointermove', (p) => {
        if (p.isDown) {
          isDragging = true;
          cam.scrollX -= (p.x - p.prevPosition.x) / cam.zoom;
          cam.scrollY -= (p.y - p.prevPosition.y) / cam.zoom;
        }
      });

      this.input.on('pointerup', (p) => {
        // Jeśli to było kliknięcie (a nie przesunięcie), buduj
        const dist = Phaser.Math.Distance.Between(p.downX, p.downY, p.upX, p.upY);
        if (dist < 15 && selectedBuildingType) {
          placeBuilding.call(this, p);
        }
        isDragging = false;
        if (preview) preview.setVisible(false);
      });

      this.input.on('pointerdown', (p) => {
        if (selectedBuildingType) {
          const def = BUILDINGS[selectedBuildingType];
          preview.setFillStyle(def.color, 0.6);
          preview.setPosition(snap(p.worldX), snap(p.worldY)).setVisible(true);
        }
      });

      cam.setBounds(0, 0, TILE * GRID, TILE * GRID);
      cam.centerOn(TILE * GRID / 2, TILE * GRID / 2);
      
      updateUI();
    }

    function update() {
      if (fpsText) fpsText.setText('FPS: ' + Math.round(this.game.loop.actualFps));
    }

    function snap(v) {
      return Math.floor(v / TILE) * TILE + TILE / 2;
    }

    function placeBuilding(p) {
      if (!selectedBuildingType) return;

      const def = BUILDINGS[selectedBuildingType];
      const x = snap(p.worldX);
      const y = snap(p.worldY);

      if (x < TILE / 2 || y < TILE / 2 || x > (GRID - 0.5) * TILE || y > (GRID - 0.5) * TILE) return;
      if (buildings.some(b => b.x === x && b.y === y)) return;

      if (gold < def.cost.gold) { showMessage('Za mało złota!'); return; }
      if (elixir < def.cost.elixir) { showMessage('Za mało eliksiru!'); return; }

      gold -= def.cost.gold;
      elixir -= def.cost.elixir;
      updateUI();

      const rect = this.add.rectangle(x, y, TILE - 6, TILE - 6, def.color)
        .setStrokeStyle(2, def.stroke);

      rect.setInteractive({ useHandCursor: true });
      
      // Usuwanie budynku
      rect.on('pointerdown', (pointer, localX, localY, event) => {
        if (event) event.stopPropagation();
        if (selectedBuildingType) return;
        
        gold += Math.floor(def.cost.gold * 0.5);
        elixir += Math.floor(def.cost.elixir * 0.5);
        updateUI();
        
        rect.destroy();
        buildings = buildings.filter(b => b !== rect);
      });

      buildings.push(rect);
      if (preview) preview.setVisible(false);
    }

    new Phaser.Game(config);
  </script>
</body>
</html>
